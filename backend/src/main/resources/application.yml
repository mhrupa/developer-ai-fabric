server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework: INFO

developer-ai-fabric:
  workspace-root: ${DAF_WORKSPACE_ROOT:${user.dir}/..}
  run-store-dir: ${DAF_RUN_STORE_DIR:${user.home}/.developer-ai-fabric/runs}
  jira-base-url: ${DAF_JIRA_BASE_URL:}
  jira-email: ${DAF_JIRA_EMAIL:}
  jira-api-token: ${DAF_JIRA_API_TOKEN:}
  cloud-watch-region: ${DAF_CLOUDWATCH_REGION:}
  cloud-watch-log-group: ${DAF_CLOUDWATCH_LOG_GROUP:}
  kb-base-url: ${DAF_KB_BASE_URL:}
  kb-api-key: ${DAF_KB_API_KEY:}
